name: Exportar dados
on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"   # pregão (UTC), a cada 15 min, dias úteis
    - cron: "5 22,23 * * 1-5"      # reforço depois do fechamento (19h05 e 20h05): garante o pregão do dia
    - cron: "0 0,6 * * *"          # fora do pregão: dados 2x ao dia
  workflow_dispatch:                # botão "Run workflow" para rodar na hora
permissions:
  contents: write
concurrency:                        # evita duas execuções ao mesmo tempo (conflito no git push)
  group: dados
  cancel-in-progress: false
jobs:
  exportar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance numpy
      - run: python scripts/exportar.py
      - name: Paper trading dos genomas (laboratório completo)
        run: python scripts/paper.py
      - name: Laboratório BASE (controle, sem as camadas novas)
        run: LAB_BASE=1 python scripts/paper.py
      - run: |
          git config user.name "dados-bot"
          git config user.email "dados-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "dados: $(date -u +%FT%TZ)" && git pull --rebase && git push)
